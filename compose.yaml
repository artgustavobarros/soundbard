services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: soundbard
      POSTGRES_USER: soundbard
      POSTGRES_PASSWORD: soundbard
    ports:
      - "127.0.0.1:55439:5432"
    volumes:
      - soundbard-postgres:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U soundbard -d soundbard" ]
      interval: 2s
      timeout: 3s
      retries: 30
  postgres-test:
    image: postgres:18-alpine
    profiles: [ test ]
    environment:
      POSTGRES_DB: soundbard_test
      POSTGRES_USER: soundbard_test
      POSTGRES_PASSWORD: soundbard_test
    ports:
      - "127.0.0.1::5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U soundbard_test -d soundbard_test" ]
      interval: 1s
      timeout: 3s
      retries: 30
volumes:
  soundbard-postgres:
